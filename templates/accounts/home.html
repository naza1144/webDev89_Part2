{% extends 'base.html' %}
{% block content %}
<h1>หน้าแรก</h1>
{% if user.is_authenticated %}
    <p>ยินดีต้อนรับ, {{ user.username }}!</p>
    <a href="{% url 'profile_edit' %}" class="btn btn-primary">แก้ไขโปรไฟล์</a>
{% else %}
    <p>ยินดีต้อนรับสู่หน้าแรกของเว็บไซต์!</p>
{% endif %}
{% endblock %}
