<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part2: Webdev 2569</title>
    {% load tailwind_tags %}
    {% tailwind_css %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Charmonman:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-50 min-h-screen flex flex-col font-sans">
    <nav class="bg-white border-b border-gray-200 mb-8">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <span class="font-semibold text-lg">My Webdev Project69</span>
            <div class="flex items-center gap-3">
                {% if user.is_authenticated %}
                <span class="me-3"> สะวักลี ทุกคง {{user.username}} </span>
                <a href="{% url 'tailwind_showcase' %}"
                    class="text-sm text-gray-200 bg-violet-400 rounded-md py-1.5 px-3 hover:text-violet-700 transition">component
                    learning</a>
                <form method="post" class="d-inline" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button
                        class="text-sm px-3 py-1.5 rounded-md bg-red-500 text-white hover:bg-red-600 hover:shadow-lg focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-all duration-200 ease-in-out">
                        logout </button>
                </form>

                {% else %}
                <a href="{% url 'login' %}" class="btn btn-sudlhor"> login </a>
                <a href="{% url 'register' %}" class="btn btn-wanarase"> register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="max-w-4xl mx-auto px-4 flex-1 w-full">
        <!-- ส่วนแสดงผลของหน้าเว็บแต่ละหน้า -->
        {% block content %}
        {% endblock %}
    </main>

</body>

</html>
