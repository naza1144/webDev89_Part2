{% extends "base.html" %}
{% block content %}
<div class="space-y-12 py-6" x-data="{ showModal: false}">
    <div class="border-b border-gray-200 py-5">
        <h1 class="text-2xl font bold">HTMX Showcase</h1>
        <p class="text-md mt-2 text-gray-500">CRUD ด้วย htnx กับข้อมูลใน DB</p>
    </div>

    <section>
        <div class="flex items-center justify-between">
            <h2 class="text-lg font-semibold">List item (add / search / delete / edit)</h2>
            <button class="btn btn-chaianan" @click="showModal = true">+ เพิ่ม</button>
        </div>
        <!-- List -->
         <div class="bg-white rounded-lg border border-gray-2 mt-1">
            <input type="text" placeholder="ค้นหา" class="px-1 py-1 ">

         </div>
         {% include "showcases/partials/demo_item_list.html" with items=demo_items %}
    </section>

    <div x-show="showModal" x-cloak @keydown.escape.window="showModal = false"
        class="fixed inset-0 bg-black/50 flex items-center justify-center z-10">

        <div x-show="showModal" x-transition @click.outside="showModal = false" class="bg-white rounded-xl p-6 w-1/2">
            <h3 class="text-lg">เพิ่มรายการใหม่</h3>
            <form hx-post="{% url 'htmx_showcase_add' %}" hx-target="#demo-search-list" hx-swap="otherHTML" @htmx:after-request="showModal=false; &set.reset()">
                <input type="text" name="title" class="border border-gray-300 rounded-md px-3 py-2 w-full mt-2" placeholder="เพิ่มรายการ...">
                <div class="flex justify-end gap-2">
                    <button type="submit" class="btn btn-chaianan">บันทึก</button>
                    <button type="button" @click="showModal = false" class="btn btn-gray">ยกเลิก</button>
                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
