<li id="item-{{ item.id }}" class="flex items-center justify-between px-4 py-2 border-b border-gray-100 last:border-0 bg-gray-50">
    <form hx-post="{% url 'htmx_showcase_edit' item.id %}" hx-target="#item-{{ item.id }}" hx-swap="outerHTML" class="flex items-center gap-2 w-full">
        {% csrf_token %}
        <input type="text" name="title" value="{{ item.title }}" required class="border border-gray-300 rounded px-2 py-1 text-sm flex-1 focus:ring-1 focus:ring-blue-500 outline-none bg-white">
        <button type="submit" class="text-xs bg-blue-600 text-white px-2.5 py-1 rounded hover:bg-blue-700 cursor-pointer">บันทึก</button>
        <button type="button" hx-get="{% url 'htmx_showcase_cancel' item.id %}" hx-target="#item-{{ item.id }}" hx-swap="outerHTML" class="text-xs bg-gray-200 text-gray-700 px-2.5 py-1 rounded hover:bg-gray-300 cursor-pointer">ยกเลิก</button>
    </form>
</li>
