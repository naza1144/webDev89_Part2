<li id="task-{{ task.id }}" class="flex items-center justify-between px-4 py-2.5 bg-blue-50/50 border-b border-gray-100 last:border-0">
  <form hx-post="{% url 'task_edit' task.id %}"
        hx-target="#task-{{ task.id }}"
        hx-swap="outerHTML"
        class="flex items-center gap-2 w-full">
    {% csrf_token %}
    <input type="text"
           name="title"
           value="{{ task.title }}"
           required
           autofocus
           class="flex-1 rounded-md border border-blue-300 bg-white px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    <button type="submit"
            class="px-3 py-1.5 rounded-md bg-blue-600 text-white text-xs font-medium hover:bg-blue-700 transition cursor-pointer">
      บันทึก
    </button>
    <button type="button"
            hx-get="{% url 'task_cancel' task.id %}"
            hx-target="#task-{{ task.id }}"
            hx-swap="outerHTML"
            class="px-3 py-1.5 rounded-md bg-gray-200 text-gray-700 text-xs font-medium hover:bg-gray-300 transition cursor-pointer">
      ยกเลิก
    </button>
  </form>
</li>
